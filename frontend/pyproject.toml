[project]
name = "melanoma-api"
version = "0.1.0"
description = "FastAPI API for melanoma classification using TFLite"
requires-python = ">=3.10,<3.13"


dependencies = [
  "fastapi==0.128.0",
  "mangum==0.20.0",
  "numpy==2.2.6",
  "pillow==12.1.0",
  "python-multipart==0.0.21",
  "uvicorn==0.40.0",
  "tflite-runtime==2.14.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
